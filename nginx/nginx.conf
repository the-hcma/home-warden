# CI-only syntax smoke-test fixture (.github/workflows/ci.yml runs `nginx -t`
# against this file). Not the served config — that lives in the separate,
# private thehcma/home repo and is passed to home-warden.service via
# HOME_NGINX_CONF. See docs/architecture-socket-activation.md.

worker_processes 1;
error_log /tmp/home-warden-nginx-error.log warn;
pid /tmp/home-warden-nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /tmp/home-warden-nginx-access.log;
    server {
        listen 127.0.0.1:8080;
        server_name _;
        location / {
            return 200 "home-warden bootstrap\n";
            add_header Content-Type text/plain;
        }
    }
}

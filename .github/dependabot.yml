version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      typescript:
        patterns:
          - "typescript"
      esbuild:
        patterns:
          - "esbuild"
